# Gera a animação da "cobrinha" comendo os quadradinhos de contribuição
# e publica no branch "output" pra ser exibida no README (seção "🐍 Contribuições").
#
# Como usar:
# 1. No seu repositório msartioli/msartioli, crie o arquivo .github/workflows/snake.yml
#    com este conteúdo exato.
# 2. Vá em Settings > Actions > General > Workflow permissions e marque
#    "Read and write permissions".
# 3. Vá na aba "Actions" do repositório, escolha o workflow "Generate Snake"
#    e rode manualmente uma vez (botão "Run workflow").
# 4. Espere terminar (1-2 min) e recarregue a página do seu perfil no GitHub.

name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03:00 UTC (00:00 em São Paulo)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gera o SVG da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publica no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
